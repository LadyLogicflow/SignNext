<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstellungen - SignNext</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Einstellungen</h1>
        </header>

        <main id="app">
            <div id="loading" class="loading">Lade Einstellungen...</div>

            <div id="einstellungen" class="hidden">
                <section class="card">
                    <h2>Aufbewahrung</h2>
                    <form id="form-einstellungen">
                        <div class="form-group">
                            <label for="aufbewahrung-tage">Aufbewahrungsdauer (Tage)</label>
                            <input type="number" id="aufbewahrung-tage" min="30" max="365" required>
                            <small>Zwischen 30 und 365 Tagen</small>
                            <div id="tage-error" class="field-error hidden"></div>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="mitglied-download-link">
                                Mitgliedern Download-Link bereitstellen
                            </label>
                        </div>

                        <div id="save-error" class="error hidden"></div>
                        <button type="submit" class="btn btn-primary">Speichern</button>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script src="einstellungen.js"></script>
</body>
</html>
