<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstellungen - SignNext</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Einstellungen</h1>
        </header>

        <main id="app">
            <div id="loading" class="loading">Lade Einstellungen...</div>

            <div id="einstellungen" class="hidden">
                <section class="card">
                    <h2>Datenschutzinformation</h2>
                    <form id="form-einstellungen">
                        <div class="form-group">
                            <label for="verantwortlicher">Verantwortlicher *</label>
                            <textarea id="verantwortlicher" rows="4" minlength="5" maxlength="500" required placeholder="Name, Anschrift, Kontakt"></textarea>
                            <small>5-500 Zeichen (Name, Anschrift, Kontakt)</small>
                            <div id="verantwortlicher-error" class="field-error hidden"></div>
                        </div>

                        <div class="form-group">
                            <label for="datenschutz-link">Datenschutz-Link *</label>
                            <input type="url" id="datenschutz-link" required placeholder="https://...">
                            <small>https-URL zu Ihrer Datenschutzerklärung</small>
                            <div id="link-error" class="field-error hidden"></div>
                        </div>

                        <div class="form-group">
                            <label for="aufbewahrung-tage">Aufbewahrungsdauer (Tage) *</label>
                            <input type="number" id="aufbewahrung-tage" min="30" max="365" required>
                            <small>Zwischen 30 und 365 Tagen</small>
                            <div id="tage-error" class="field-error hidden"></div>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="mitglied-download-link">
                                Mitgliedern Download-Link bereitstellen
                            </label>
                        </div>

                        <div id="save-error" class="error hidden"></div>
                        <button type="submit" class="btn btn-primary">Speichern</button>
                    </form>
                </section>

                <section id="demo-testmail" class="card hidden">
                    <h2>Demo: Testmail</h2>
                    <p id="demo-versand-info"></p>
                    <div class="form-group">
                        <label for="demo-testadresse">Erlaubte Adresse</label>
                        <select id="demo-testadresse"></select>
                    </div>
                    <div id="demo-testmail-fehler" class="error hidden" role="alert"></div>
                    <div id="demo-testmail-erfolg" class="success-text hidden" role="status"></div>
                    <button id="btn-demo-testmail" type="button" class="btn btn-secondary">Testmail an erlaubte Adresse</button>
                </section>
            </div>
        </main>
    </div>

    <script src="berater.js"></script>
    <script src="einstellungen.js"></script>
</body>
</html>
