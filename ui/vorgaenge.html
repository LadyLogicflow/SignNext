<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vorgänge - SignNext</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="berater.css">
</head>
<body class="berater">
    <div class="band">
        <div class="band-in">
            <span id="wortmarke" class="wortmarke" role="img" aria-label="BSt Next"></span>
            <p class="band-tag">Unterschriften einholen &amp; nachweisen</p>
            <a id="portal-link" class="band-link hidden" href="#">← Zurück zum Hauptportal</a>
        </div>
    </div>
    <div class="container">
        <p class="eyebrow">Beratungsstelle</p>
        <h1>Unterschriften einholen</h1>
        <p id="angemeldet" class="angemeldet hidden"></p>
        <nav id="berater-nav" class="menue" aria-label="Menü der Beratungsstelle">
            <a href="/vorgaenge" aria-current="page">Vorgänge</a>
            <a href="/mail-zugang">Mail-Zugang</a>
            <a href="/einstellungen">Einstellungen</a>
        </nav>
        <div id="hinweisleiste"></div>

        <main id="app">
            <section id="demo-bereich" class="card hidden">
                <h2>Demo</h2>
                <p>Alle Daten sind erfunden. Hier können Sie Beispieldokumente laden und einen fertigen Demo-Vorgang anlegen.</p>
                <p>Beispiel-PDFs: <span id="demo-beispiele"></span></p>
                <button id="btn-demo-vorgang" type="button" class="btn btn-primary">Demo-Vorgang anlegen</button>
                <div id="demo-fehler" class="error hidden" role="alert"></div>
                <div id="demo-ergebnis" class="info-box hidden"></div>
            </section>

            <div id="loading" class="loading">Lade Vorgänge...</div>

            <div id="vorgaenge" class="hidden">
                <div id="vorgaenge-liste"></div>
            </div>
        </main>
    </div>

    <script src="qrbild.js"></script>
    <script src="wortmarke.js"></script>
    <script src="berater.js"></script>
    <script src="vorgaenge.js"></script>
</body>
</html>
