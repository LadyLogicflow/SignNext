<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unterschrift - SignNext</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Elektronische Unterschrift</h1>
        </header>

        <main id="app">
            <!-- Schritt 1: Hinweis + Geburtsdatum -->
            <div id="step-hinweis" class="step">
                <div id="hinweis-text" class="info-box"></div>
                <form id="form-code">
                    <div class="form-group">
                        <label for="code">Geburtsdatum (TT.MM.JJ)</label>
                        <input type="text" id="code" placeholder="01.01.90" maxlength="8" required pattern="\d{2}\.\d{2}\.\d{2}">
                        <small>Geben Sie Ihr Geburtsdatum ein (6 Ziffern)</small>
                    </div>
                    <div id="code-error" class="error hidden"></div>
                    <div id="versuch-info" class="warning hidden"></div>
                    <button type="submit" class="btn btn-primary">Weiter</button>
                </form>
            </div>

            <!-- Schritt 2: Seiten ansehen -->
            <div id="step-seiten" class="step hidden">
                <div class="info-box">
                    <p>Bitte lesen Sie das Dokument vollständig durch. Alle Seiten müssen angezeigt worden sein.</p>
                </div>
                <div id="seiten-container"></div>
                <div id="seiten-fortschritt" class="progress hidden">
                    <span id="seiten-geladen">0</span> von <span id="seiten-gesamt">0</span> Seiten angezeigt
                </div>
                <button id="btn-gelesen" class="btn btn-primary" disabled>Vollständig gelesen</button>
            </div>

            <!-- Schritt 3: Datenschutz + Unterschrift -->
            <div id="step-unterschrift" class="step hidden">
                <div id="datenschutz-text" class="datenschutz-box"></div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="check-datenschutz">
                        <span id="haken-text"></span>
                    </label>
                </div>

                <div class="form-group">
                    <label for="unterschrift-canvas">Unterschrift (mit Maus/Touch zeichnen)</label>
                    <canvas id="unterschrift-canvas" width="600" height="200"></canvas>
                    <div class="canvas-actions">
                        <button id="btn-clear" type="button" class="btn btn-secondary">Löschen</button>
                    </div>
                </div>

                <div id="unterschrift-error" class="error hidden"></div>
                <button id="btn-unterschreiben" class="btn btn-primary">Unterschreiben</button>
            </div>

            <!-- Fertig -->
            <div id="step-fertig" class="step hidden">
                <div class="success-box">
                    <h2>Vielen Dank!</h2>
                    <p>Ihre Unterschrift wurde erfolgreich übermittelt.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
